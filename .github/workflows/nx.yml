name: CI
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: master
      - run: npm ci

      - run: npx nx format:check --base="$NX_BASE" --head="$NX_HEAD"
      - run: npx nx affected -t lint --parallel=3 --base="$NX_BASE" --head="$NX_HEAD"
      - run: npx nx affected -t test --parallel=3 --base="$NX_BASE" --head="$NX_HEAD"
      - run: npx nx affected -t build --parallel=3 --base="$NX_BASE" --head="$NX_HEAD"
      - run: npx nx affected -t typecheck:specs --parallel=3 --base="$NX_BASE" --head="$NX_HEAD"
      - run: npx nx affected -t e2e --parallel=3 --base="$NX_BASE" --head="$NX_HEAD"
